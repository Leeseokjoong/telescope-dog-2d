<style>

<script>

// z: 길을 따라 카메라에서 멀어지는 거리, x: 길에서 좌우로 벗어난 정도, y: 높이
// 길 위의 점은 그림 픽셀 좌표(1774x887)로 찍고, s는 그 지점에서 1m가 몇 그림 픽셀인지.

const ROUTE_IMG = [
  { x: 905, y: 905, s: 230, hw: 1.0 },
  { x: 865, y: 830, s: 175, hw: 1.0 },
  { x: 800, y: 775, s: 130, hw: 1.1 },
  { x: 730, y: 735, s: 95, hw: 1.2 },
  { x: 685, y: 695, s: 70, hw: 1.3 },
  { x: 690, y: 655, s: 52, hw: 1.4 },
  { x: 722, y: 627, s: 40, hw: 1.6 },
  { x: 770, y: 610, s: 32, hw: 2.2, beach: true },   // 해변
  { x: 830, y: 598, s: 28, hw: 2.4, water: true },   // 석호로 들어감
  { x: 900, y: 565, s: 24, hw: 3.0, water: true },

const ROUTE = [];
(function buildRoute() {
  let z = 0;

    const q = { x: p.x * K, y: p.y * K, s: p.s * K, hw: p.hw, water: !!p.water, beach: !!p.beach };
    if (i > 0) { const a = ROUTE[i - 1]; z += Math.hypot(q.x - a.x, q.y - a.y) / ((a.s + q.s) / 2); }
    q.z = z; ROUTE.push(q);
  });
})();
const Z_MAX = ROUTE[ROUTE.length - 1].z;
const Z_WATER = ROUTE.find(p => p.water).z - 0.35;
const Z_BEACH = ROUTE.find(p => p.beach).z;

const proj = (x, z, y = 0) => { const r = routeAt(z); return { sx: r.x + x * r.s, sy: r.y - y * r.s, s: r.s }; };

function zAtImgY(yImg) { const y = yImg * K; for (let z = 0; z <= Z_MAX; z += 0.005) if (routeAt(z).y <= y) return z; return 0; }

// ---------- 배경 그림 ----------
const PANO = { dusk: new Image(), night: new Image() };

const SUN_IMG = { x: 1297, y: 285, r: 20 }, HORIZON_IMG = 300;
let duskNoSun = null;
function prepDusk() {

  grd.addColorStop(0, `rgba(${col},1)`); grd.addColorStop(0.55, `rgba(${col},0.95)`); grd.addColorStop(1, `rgba(${col},0)`);

// 해변 물가 선 (파도가 밀려왔다 빠지는 곳), 그림 픽셀 좌표
const SHORE_IMG = [[575, 455], [585, 500], [610, 545], [660, 580], [730, 602], [820, 612], [920, 616], [1010, 612], [1090, 600]];

// ---------- 픽셀 스프라이트 ----------
function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {

    const got = await Promise.all(RADIO_SRCS.map(async src => { try { const r = await fetch(src); return r.ok ? await AC.decodeAudioData(await r.arrayBuffer()) : null; } catch (e) { return null; } }));
    radioLoading = false; got.forEach(b => b && radioBufs.push(b));
    if (!radioBufs.length) { setHint(T('라디오 음악을 불러오지 못했어요', 'Couldn\'t load the music'), 2500); radioOn = false; $('bRadio').classList.remove('on'); $('bRadio').textContent = T('음악 켜기 (R)', 'Music on (R)'); return; }
    if (!radioOn) return;
  }
  radioG = AC.createGain(); radioG.gain.value = 0; radioG.connect(master); radioG.gain.linearRampToValueAtTime(0.6, AC.currentTime + 3);
  if (thrown) setHint(T('잔잔한 음악을 틀었어요', 'Playing some calm music'), 2000);
  playSeg(radioG, AC.currentTime + 0.05);
}
function playSeg(out, when) {
  const XF = 4, buf = radioBufs[radioI++ % radioBufs.length], dur = buf.duration;
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = buf; s.connect(g); g.connect(out);
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(1, when + XF); g.gain.setValueAtTime(1, when + dur - XF); g.gain.linearRampToValueAtTime(0, when + dur);
  s.start(when); s.stop(when + dur + 0.1);
  radioTimer = setTimeout(() => { if (radioOn && radioG === out) playSeg(out, when + dur - XF); }, Math.max(0, (when + dur - XF - AC.currentTime - 1.5) * 1000));
}

// ---------- 그만 쉬기 ----------
const sessionStart = Date.now();
let totalBefore = 0;
try { totalBefore = +localStorage.getItem('healTotal') || 0; } catch (e) {}
function fmtDur(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = Math.floor(sec % 60);
  return LANG === 'en' ? (h ? `${h}h ${m}m` : m ? `${m}m ${s}s` : `${s}s`) : h ? `${h}시간 ${m}분` : m ? `${m}분 ${s}초` : `${s}초`;
}
let ended = false;
function endRest() {
  if (ended) return; ended = true;
  const sec = (Date.now() - sessionStart) / 1000;
  try { localStorage.setItem('healTotal', String(totalBefore + sec)); } catch (e) {}
  $('endTime').textContent = fmtDur(sec);
  $('endTotal').textContent = fmtDur(totalBefore + sec);
  $('end').classList.add('show'); setHint('');
  if (AC && master) { master.gain.cancelScheduledValues(AC.currentTime); master.gain.setValueAtTime(master.gain.value, AC.currentTime); master.gain.linearRampToValueAtTime(0, AC.currentTime + 4); }
}

// ---------- 루프 ----------
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; time += dt; mouseIdle += dt;
  updateBall(dt); updateDog(dt); updateCrab(dt); updateGull(dt);
  for (const f of fliers) f.a += f.sp * dt;
  for (const r of ripples) r.t += dt; while (ripples.length && ripples[0].t > 1.4) ripples.shift();
  for (const q of parts) { q.vy -= 9 * dt; q.x += q.vx * dt; q.z += q.vz * dt; q.y += q.vy * dt; }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].y < 0) parts.splice(i, 1);

  // 망원경 시점
  zoom = lerp(zoom, zoomT, 1 - Math.exp(-6 * dt));
  const PX = (cv.height / H) * BASEZ * zoom; // 기준 좌표 1이 캔버스 몇 픽셀인지
  const hw = cv.width / 2 / PX, hh = cv.height / 2 / PX;
  if (zoomT > 1.01 && followDog && time - lastDrag > 3) {
    const p = proj(dog.x, dog.z, dog.y + 0.4);
    vx = lerp(vx, p.sx, 1 - Math.exp(-3 * dt)); vy = lerp(vy, p.sy, 1 - Math.exp(-3 * dt));
  }
  vx = clamp(vx, hw, W - hw); vy = clamp(vy, hh, H - hh); viewPX = PX;

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(PX, 0, 0, PX, cv.width / 2 - vx * PX, cv.height / 2 - vy * PX);
  drawBackground(); drawWaves(); drawSparkles(); drawRipples(); drawFire(dt); updateFireSound(dt);
  ctx.imageSmoothingEnabled = false;
  const ents = [{ z: dog.z, d: drawDog }, { z: ball.z, d: drawBall }, { z: crab.z, d: drawCrab }];
  if (gull.state !== 'sky') ents.push({ z: gull.z, d: drawGull });
  for (const f of fliers) ents.push({ z: 999, d: () => drawFlier(f) });
  for (const q of parts) ents.push({ z: q.z, d: () => { const p = proj(q.x, q.z, q.y), s = Math.max(0.7, 0.03 * p.s); ctx.fillStyle = 'rgba(235,250,250,.9)'; ctx.fillRect(p.sx, p.sy, s, s); } });
  ents.sort((a, b) => b.z - a.z).forEach(e => e.d());

  if (zoom > 1.03) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const a = clamp((zoom - 1) / 0.6, 0, 1), cx = cv.width / 2, cy = cv.height / 2, R = cv.height * 0.49 + (1 - a) * 700;
    ctx.fillStyle = `rgba(8,5,10,${0.94 * a})`;
    ctx.beginPath(); ctx.rect(0, 0, cv.width, cv.height); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill('evenodd');
    ctx.strokeStyle = `rgba(60,40,30,${a})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  }
  requestAnimationFrame(frame);
}

// ---------- 입력 ----------
const hintEl = document.getElementById('hint');
let hintTimer = 0;
function setHint(html, ms) {
  clearTimeout(hintTimer);
  if (!html) { hintEl.style.opacity = 0; return; }
  hintEl.innerHTML = html; hintEl.style.opacity = 1;
  if (ms) hintTimer = setTimeout(() => hintEl.style.opacity = 0, ms);
}
function fit() {
  const book = document.getElementById('book'), ui = document.getElementById('ui');
  const clean = document.body.classList.contains('clean');
  const used = (clean ? 0 : ui.offsetHeight + 30) + (book.classList.contains('open') ? book.offsetHeight + 10 : 0);
  const s = Math.min((innerWidth - (clean ? 0 : 32)) / cv.width, Math.max(120, innerHeight - used) / cv.height);
  cv.style.width = cv.width * s + 'px'; cv.style.height = cv.height * s + 'px';
}
addEventListener('resize', fit); fit();
// 전체화면: 버튼을 모두 감추고 풍경만 보기
function setClean(on) {
  document.body.classList.toggle('clean', on);
  const fs = document.fullscreenElement;
  if (on && !fs) document.documentElement.requestFullscreen?.().catch(() => {});
  if (!on && fs) document.exitFullscreen?.().catch(() => {});
  fit();
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('clean')) setClean(false); else fit(); });

// ---------- 책 ----------
// 우리가 직접 쓴 짧은 글. 한 줄 묶음이 한 장.
const BOOKS_KO = [
  { title: '파도가 남기는 것', pages: [
    '파도는 하루에도 수천 번\n같은 모래 위로 올라왔다가 돌아간다.',
    '올 때마다 무언가를 조금씩 두고 간다.\n조개껍데기 하나, 반짝이는 물기, 작은 거품.',
    '그리고 돌아갈 때는\n발자국을 하나씩 데려간다.',
    '그래서 해변은 늘 처음 같다.\n오늘 걸은 길도, 내일이면 새 길이 된다.',
  ] },
  { title: '공을 물고 오는 길', pages: [
    '공을 던지면 강아지는 뒤도 보지 않고 달려간다.\n세상에 그 공 하나만 있는 것처럼.',
    '그런데 돌아오는 길은 늘 조금 길다.\n게를 만나고, 갈매기를 쫓고, 웅덩이를 들여다본다.',
    '처음엔 빨리 오라고 불렀다.\n이제는 그냥 바라본다.',
    '어쩌면 강아지는 공을 가지러 간 게 아니라\n돌아오는 길을 즐기러 간 건지도 모른다.',
  ] },
  { title: '해 질 녘의 편지', pages: [
    '해가 바다에 닿기 직전,\n하늘은 하루 동안 모은 색을 전부 꺼내 놓는다.',
    '분홍, 보라, 금빛.\n아무도 주문하지 않았는데 매일 배달되는 편지.',
    '읽는 방법은 간단하다.\n아무것도 하지 않고, 끝까지 보는 것.',
    '오늘도 잘 받았습니다.\n내일도 여기 앉아 있을게요.',
  ] },
];
const BOOKS_EN = [
  { title: 'What the Waves Leave Behind', pages: [
    'Thousands of times a day, the waves\nclimb the same sand and slip back again.',
    'Each time, they leave a little something.\nA seashell, a glint of water, a bubble of foam.',
    'And when they go back,\nthey take one footprint with them.',
    'That is why the beach always feels new.\nThe path you walked today is a new path tomorrow.',
  ] },
  { title: 'The Way Back with the Ball', pages: [
    'When you throw the ball, the dog runs without looking back,\nas if that ball were the only thing in the world.',
    'But the way back is always a little longer.\nA crab to meet, a gull to chase, a puddle to peer into.',
    'At first, I called it to hurry back.\nNow I just watch.',
    'Maybe the dog does not go to fetch the ball at all.\nMaybe it goes to enjoy the way back.',
  ] },
  { title: 'A Letter at Dusk', pages: [
    'Just before the sun touches the sea,\nthe sky lays out every color it gathered all day.',
    'Pink, violet, gold.\nA letter no one ordered, delivered every single day.',
    'Reading it is simple.\nDo nothing, and watch until the very end.',
    'Received again today, thank you.\nI will be sitting here tomorrow, too.',
  ] },
];
const BOOKS = LANG === 'en' ? BOOKS_EN : BOOKS_KO;
let bookI = 0, pageI = 0, typeT = null;
const bookEl = document.getElementById('book');
function showPage() {
  const b = BOOKS[bookI], txt = b.pages[pageI];
  $('bookTitle').textContent = LANG === 'en' ? `“${b.title}”` : `『${b.title}』`;
  $('bookPage').textContent = LANG === 'en' ? `Story ${bookI + 1} · ${pageI + 1} / ${b.pages.length}` : `${bookI + 1}편 · ${pageI + 1} / ${b.pages.length}`;
  $('bookPrev').style.visibility = bookI === 0 && pageI === 0 ? 'hidden' : 'visible';
  const last = bookI === BOOKS.length - 1 && pageI === b.pages.length - 1;
  $('bookMore').textContent = last ? T('마지막 장이에요', 'Last page') : pageI === b.pages.length - 1 ? T('클릭하면 다음 이야기 ▼', 'Click for the next story ▼') : T('클릭하면 다음 장 ▼', 'Click for the next page ▼');
  clearInterval(typeT);
  let n = 0; $('bookText').textContent = '';
  typeT = setInterval(() => { n++; $('bookText').textContent = txt.slice(0, n); if (n >= txt.length) { clearInterval(typeT); typeT = null; } }, 45);
}
function nextPage() {
  const b = BOOKS[bookI];
  if (typeT) { clearInterval(typeT); typeT = null; $('bookText').textContent = b.pages[pageI]; return; } // 글자가 나오는 중이면 한 번에 다 보여주기
  if (pageI < b.pages.length - 1) pageI++;
  else if (bookI < BOOKS.length - 1) { bookI++; pageI = 0; }
  else return;
  showPage();
}
function prevPage() {
  if (pageI > 0) pageI--;
  else if (bookI > 0) { bookI--; pageI = BOOKS[bookI].pages.length - 1; }
  showPage();
}
function setBook(open) {
  bookEl.classList.toggle('open', open);
  $('bBook').classList.toggle('on', open);
  $('bBook').textContent = open ? T('책 덮기 (B)', 'Close book (B)') : T('책 펴기 (B)', 'Open book (B)');
  if (open) showPage(); else { clearInterval(typeT); typeT = null; }
  fit();
}
bookEl.addEventListener('click', e => { if (e.target.id === 'bookClose') setBook(false); else if (e.target.id === 'bookPrev') prevPage(); else nextPage(); });

function toBase(e) {
  const r = cv.getBoundingClientRect(), cx = (e.clientX - r.left) / r.width * cv.width, cy = (e.clientY - r.top) / r.height * cv.height;
  return { x: (cx - cv.width / 2) / viewPX + vx, y: (cy - cv.height / 2) / viewPX + vy };
}
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  initAudio();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  drag = { x: e.clientX, y: e.clientY, vx, vy, moved: false };
});
cv.addEventListener('pointermove', e => {
  mouseIdle = 0;
  if (!drag) { petMove(e); return; }
  const r = cv.getBoundingClientRect(), sc = cv.width / r.width / viewPX, dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
  if (drag.moved) { vx = drag.vx - dx * sc; vy = drag.vy - dy * sc; lastDrag = time; cv.style.cursor = 'grabbing'; }
});
cv.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null; cv.style.cursor = '';
  if (!d.moved) clickAt(toBase(e));
});
function clickAt(b) {
  if (petable() && overDog(b)) { if (dog.state !== 'pet') { dog.state = 'pet'; dog.petT = 0; } dog.petIdle = 0; hearts.push({ x: b.x, y: b.y, t: time }); happyWhine(); return; }
  if (ball.state !== 'held' || !['home', 'homesleep'].includes(dog.state)) {
    setHint(T('강아지가 아직 놀고 있어요. <b>스페이스</b>로 휘파람을 불어 보세요', 'Your dog is still playing. Press <b>Space</b> to whistle'), 2500); return;
  }
  let t = unproj(b.x, b.y);
  if (!t && b.y < ROUTE[ROUTE.length - 1].y) t = { x: 0, z: Z_MAX }; // 하늘이나 먼 바다를 누르면 아주 멀리
  if (!t || t.z < 0.6) return;
  throwAt(t.x, t.z);
}
cv.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.deltaY < 0) { const b = toBase(e); vx = lerp(vx, b.x, 0.2); vy = lerp(vy, b.y, 0.2); }
  zoomT = clamp(zoomT * Math.exp(-e.deltaY * 0.0015), 1, 6);
}, { passive: false });

const $ = id => document.getElementById(id);
function setType(t) { curType = t; $('bBall').classList.toggle('on', t === 'ball'); $('bDisc').classList.toggle('on', t === 'disc'); if (ball.state === 'held') ball.type = t; }
function setFollow(v) { followDog = v; $('bFollow').classList.toggle('on', v); }
function setMute(v) { muted = v; if (master) master.gain.value = v ? 0 : 0.7; $('bMute').textContent = v ? T('소리 꺼짐', 'Sound off') : T('소리 켜짐', 'Sound on'); }
$('bFire').onclick = toggleFire;
$('bMagic').onclick = magicPowder;
$('bRadio').onclick = toggleRadio;
$('bLang').onclick = () => { location.search = '?lang=' + (LANG === 'ko' ? 'en' : 'ko'); };
$('bClean').onclick = () => setClean(true);
$('showUI').onclick = () => setClean(false);
$('bEnd').onclick = endRest;
$('bAgain').onclick = () => location.reload();
$('bWork').onclick = () => { $('end').classList.add('done'); window.close(); }; // 브라우저가 창 닫기를 막으면 안내 문구만 남음
$('bBook').onclick = () => setBook(!bookEl.classList.contains('open'));
$('bBall').onclick = () => setType('ball');
$('bDisc').onclick = () => setType('disc');
$('bWhistle').onclick = whistle;
$('bZin').onclick = () => { zoomT = clamp(zoomT * 1.6, 1, 6); };
$('bZout').onclick = () => { zoomT = clamp(zoomT / 1.6, 1, 6); };
$('bFollow').onclick = () => setFollow(!followDog);
$('bMute').onclick = () => { initAudio(); setMute(!muted); };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); whistle(); }
  else if (e.key === 'c' || e.key === 'C') toggleFire();
  else if (e.key === 'v' || e.key === 'V') magicPowder();
  else if (e.key === 'r' || e.key === 'R') toggleRadio();
  else if (e.key === 'h' || e.key === 'H') setClean(!document.body.classList.contains('clean'));
  else if (e.key === 'Escape') endRest();
  else if (e.key === 'b' || e.key === 'B') setBook(!bookEl.classList.contains('open'));
  else if (e.key === 'Enter' && bookEl.classList.contains('open')) nextPage();
  else if (e.key === '1') setType('ball');
  else if (e.key === '2') setType('disc');
  else if (e.key === 't' || e.key === 'T') { todSpeed = todSpeed === 1 ? 12 : 1; setHint(todSpeed === 1 ? T('시간이 보통 속도로 흘러요', 'Time flows normally') : T('시간이 빠르게 흘러요 (T로 되돌리기)', 'Time is flowing fast (T to reset)'), 2000); }
  else if (e.key === 'f' || e.key === 'F') setFollow(!followDog);
  else if (e.key === '+' || e.key === '=') zoomT = clamp(zoomT * 1.6, 1, 6);
  else if (e.key === '-') zoomT = clamp(zoomT / 1.6, 1, 6);
  else if (e.key === 'm' || e.key === 'M') { initAudio(); setMute(!muted); }
});

// 브라우저는 한 번 누르기 전엔 소리를 막음 → 첫 클릭·키 입력에 파도 소리와 음악을 함께 켬
let autoMusic = true;
function firstSound() { removeEventListener('pointerdown', firstSound, true); removeEventListener('keydown', firstSound, true); initAudio(); if (autoMusic && !radioOn) toggleRadio(); }
addEventListener('pointerdown', firstSound, true); addEventListener('keydown', firstSound, true);
PANO.dusk.onload = prepDusk; if (PANO.dusk.complete && PANO.dusk.naturalWidth) prepDusk();
requestAnimationFrame(frame);
</script>
